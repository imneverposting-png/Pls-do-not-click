name: Build pls do not click

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -o *.zip
          sed -i 's/"geode": "\$GEODE_VERSION"/"geode": "v5.10.1"/' mod.json

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: given

      - name: Upload finished mod
        uses: actions/upload-artifact@v4
        with:
          name: pls-do-not-click
          path: ${{ steps.build.outputs.build-output }}/*.geode
